<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a14" />
    <meta name="description" content="Royion Friend Edition — the daily trivia dive. 7 prompts, 25 seconds each. Rarer answers sink deeper." />
    <title>ROYION — The Daily Dive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <dialog id="dialog-menu" class="kr-dialog" closedby="any" aria-label="Menu"></dialog>
